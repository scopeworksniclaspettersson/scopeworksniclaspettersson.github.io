\" längst ned i dokumentet\u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003c!-- TAB 5: INVÄNDNINGAR --\u003e\n\u003cdiv class=\"panel\" id=\"tab-5\"\u003e\n\u003cdiv style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:7px\"\u003e\n  \u003cdiv style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#888\"\u003eInvändningsblock\u003c/div\u003e\n  \u003cdiv style=\"display:flex;gap:6px;align-items:center\"\u003e\n    \u003cselect class=\"sort-sel\" onchange=\"invSortBy(this.value)\"\u003e\n      \u003coption value=\"newest\"\u003eSenaste\u003c/option\u003e\u003coption value=\"step\"\u003ePer steg\u003c/option\u003e\n      \u003coption value=\"cat\"\u003ePer kategori\u003c/option\u003e\u003coption value=\"freq\"\u003eMest förekommande\u003c/option\u003e\n    \u003c/select\u003e\n    \u003cbutton class=\"tog-btn\" id=\"inv-tog\" onclick=\"toggleInvForm()\"\u003e+ Lägg till\u003c/button\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003cdiv class=\"inv-add-box\" id=\"inv-form\" style=\"display:none\"\u003e\n  \u003cdiv class=\"inv-add-title\"\u003eNy invändning\u003c/div\u003e\n  \u003cdiv class=\"form-grid\"\u003e\n    \u003cdiv\u003e\u003cdiv class=\"field-lbl\"\u003eSäljsteg\u003c/div\u003e\n      \u003cselect class=\"fsel\" id=\"f-step\"\u003e\n        \u003coption value=\"1\"\u003e1 · Bokat möte\u003c/option\u003e\u003coption value=\"2\"\u003e2 · Församtal\u003c/option\u003e\n        \u003coption value=\"3\" selected\u003e3 · Genomgång\u003c/option\u003e\u003coption value=\"4\"\u003e4 · Kundplan\u003c/option\u003e\n        \u003coption value=\"5\"\u003e5 · Testperiod\u003c/option\u003e\u003coption value=\"6\"\u003e6 · Beslut\u003c/option\u003e\n      \u003c/select\u003e\u003c/div\u003e\n    \u003cdiv\u003e\u003cdiv class=\"field-lbl\"\u003eKategori\u003c/div\u003e\n      \u003cselect class=\"fsel\" id=\"f-cat\"\u003e\n        \u003coption value=\"pris\"\u003ePris/Budget\u003c/option\u003e\u003coption value=\"konkurrens\"\u003eKonkurrens\u003c/option\u003e\n        \u003coption value=\"timing\"\u003eTiming/Nu\u003c/option\u003e\u003coption value=\"teknik\"\u003eTeknik/IT\u003c/option\u003e\n        \u003coption value=\"beslut\"\u003eBeslutsprocess\u003c/option\u003e\u003coption value=\"risk\"\u003eRisk/Säkerhet\u003c/option\u003e\n        \u003coption value=\"behov\"\u003eBehov/Relevans\u003c/option\u003e\u003coption value=\"annat\"\u003eAnnat\u003c/option\u003e\n      \u003c/select\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv style=\"margin-bottom:9px\"\u003e\u003cdiv class=\"field-lbl\"\u003eInvändningen\u003c/div\u003e\n    \u003ctextarea class=\"finp ftxt\" id=\"f-inv\" placeholder='\"Vi har redan ett system som fungerar\"'\u003e\u003c/textarea\u003e\u003c/div\u003e\n  \u003cdiv style=\"margin-bottom:11px\"\u003e\u003cdiv class=\"field-lbl\"\u003eHur vi förekomma / hanterar den\u003c/div\u003e\n    \u003ctextarea class=\"finp ftxt\" id=\"f-svar\" placeholder='Fråga: \"Vilket system?\" – visa vad det saknar...'\u003e\u003c/textarea\u003e\u003c/div\u003e\n  \u003cbutton class=\"save-btn\" onclick=\"saveInv()\"\u003eSpara\u003c/button\u003e\n  \u003cbutton class=\"cancel-btn\" onclick=\"toggleInvForm()\"\u003eAvbryt\u003c/button\u003e\n\u003c/div\u003e\n\u003cdiv class=\"inv-stat-grid\" id=\"inv-stat-grid\"\u003e\u003c/div\u003e\n\u003cdiv class=\"filter-row\" id=\"inv-filter-row\"\u003e\u003c/div\u003e\n\u003cdiv id=\"inv-list\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n\n\u003c!-- TAB 6: TIDSLINJE --\u003e\n\u003cdiv class=\"panel\" id=\"tab-6\"\u003e\n\u003cdiv class=\"gantt-wrap\"\u003e\u003cdiv class=\"gantt-inner\" id=\"gantt-inner\"\u003e\u003c/div\u003e\u003c/div\u003e\n\u003c/div\u003e\n\n\u003c!-- TAB 7: MÖTESSTRUKTUR --\u003e\n\u003cdiv class=\"panel\" id=\"tab-7\"\u003e\n\u003cdiv class=\"ms-header\"\u003eRöd tråd – Genomgångens tidplan\u003c/div\u003e\n\u003ctable class=\"ms-tbl\"\u003e\u003cthead\u003e\u003ctr\u003e\n  \u003cth style=\"width:40px\"\u003e#\u003c/th\u003e\u003cth\u003eSteg\u003c/th\u003e\u003cth style=\"width:110px\"\u003eVisualisering\u003c/th\u003e\u003cth\u003eTid\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody id=\"ms-body\"\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cdiv class=\"ms-comment\"\u003e\n  \u003cdiv class=\"ms-comment-lbl\"\u003eNotera\u003c/div\u003e\n  Då har vi ca 5–10 minuter att ställa frågor och djupdyka – men ändå hålla mötet effektivt.\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cscript\u003e\n\nconst STEPS=[\n  {id:1,color:'#4BBFB5',bg:'#E6F8F7',title:'Bokat möte',sub:'Prospektering och förberedelse',dur:'Dag 0',\n   sections:[\n    {key:'Prospektering',items:['Identifiera rätt person – VD, säkerhetschef eller parkeringsansvarig','Besök på LinkedIn (om de har någon)','Skicka kort personligt mail','Ring och boka genomgång']},\n    {key:'Bekräftelse',items:['Skicka kalenderinbjudan med agenda','Bekräfta rätt deltagare och beslutsfattare','Skicka kort produktvideo om Scopeguard (endast när vi har en på plats)']},\n  ]},\n  {id:2,color:'#4BBFB5',bg:'#E6F8F7',title:'Församtal: Behovsanalys',sub:'Nuläge, framtid, konsekvens och bromsen',dur:'30–45 min',\n   sections:[\n    {key:'Öppning',items:['Agendafråga: \"Vad ska ni kunna ta ett beslut om när vi lämnar mötet?\"','Bekräfta förväntningar och tid']},\n    {key:'Nuläge',items:['Vilka system arbetar ni i idag för parkering, bevakning och tillstånd?','Vart upplever du att ni tappar mest tid eller kontroll i arbetet idag?','Vad betalar ni per [area] – info vi behöver för att sätta ROI-kalkylen']},\n    {key:'Framtid',items:['Vad behöver bli bättre för att ni ska bli mer effektiva i ert arbete?','Vad skulle ni vilja ha bättre kontroll eller överblick över idag som ni saknar?']},\n    {key:'Konsekvens',items:['Vad händer om ni fortsätter arbeta så här kommande 12 månader?','Vad behöver fungera bättre för att ni ska kunna växa utan att öka administrationen?']},\n    {key:'Varför man ej agerat',items:['Vad är det som gör att ni inte har agerat på dessa utmaningar än?','Vad är risken om vi skjuter fram utmaningen 3–6 månader – vad kommer förändras?']},\n    {key:'Nästa steg',items:['Boka Genomgång direkt i mötet','Skicka ROI-kalkyl baserad på siffrorna du fått']},\n  ]},\n  {id:3,color:'#5B85F0',bg:'#EEF3FF',title:'Genomgång',sub:'Demo anpassad till kundens situation',dur:'45 min',\n   sections:[\n    {key:'Agenda – mötets 10 punkter',items:null,agenda:['Agenda','Summering','Målsättning – åtagande från kunden','Referens: Alingsås Vakt','Besparingskalkyl','Systemet: 2–3 funktioner','Investering','Hur ett samarbete ser ut','Målsättning uppföljning','Nästa steg']},\n    {key:'Öppning',items:['Vi har 45 minuter. Mitt mål är att förstå er bättre och visa hur vi kan hjälpa er.','Snabb recap av vad ni hörde i Församtalet']},\n    {key:'Bevis',items:['Alingsås Vakt: Problem → Lösning → Resultat','ROI-kalkyl baserad på deras volym']},\n    {key:'Systemet',items:['2–3 flöden kopplade till kundens utmaning','Vaktrond + GPS-historik (väktarbolag)','P-kontroll + inkasso + kundportal (parkeringsbolag)']},\n    {key:'Investering',items:['Funktioner → Investering → När man har betalt tillbaka','Pausa 3 sekunder efter priset – säg ingenting']},\n    {key:'Avslut',items:['Målsättningsuppföljning: \"Har vi uppnått X, Y och Z?\"','Boka implementationssamtal med CTO direkt i mötet']},\n  ]},\n  {id:4,color:'#D97706',bg:'#FFF8E9',title:'Kundplan (Implementation)',sub:'Fyll i MAP tillsammans med kunden',dur:'20–30 min',\n   sections:[\n    {key:'Målsättning',items:['Formulera 2 framgångskriterier med kundens egna ord']},\n    {key:'Scopeworks behöver',items:['Fastighetsinformation och parkeringsytor','Tillståndsdata och kontaktuppgifter']},\n    {key:'Kund tillhandahåller',items:['Tillgång till objekt för konfiguration','Kontaktperson som äger systemet internt']},\n    {key:'Testperiod 30 dagar',items:['Startdatum och slutdatum – bestäms nu','Uppföljning var sjunde dag (10 min)']},\n    {key:'Signering',items:['30-dagars avtal signeras']},\n  ]},\n  {id:5,color:'#D97706',bg:'#FFF8E9',title:'Testperiod 30 dagar',sub:'Leverans, drift och veckovisa avstämningar',dur:'30 dagar',\n   sections:[\n    {key:'Vecka 1',items:['Scopeworks konfigurerar fastigheten','Alla inlogg skapade och testade']},\n    {key:'Vecka 2–3',items:['Statistik, support och direkta justeringar']},\n    {key:'Vecka 4',items:['Statistik och utvärdering mot framgångskriterierna','Förbered Beslutsmötet']},\n  ]},\n  {id:6,color:'#22A63A',bg:'#EDFBEF',title:'Beslut om fortsättning',sub:'Go/no-go baserat på gemensam målsättning',dur:'20–30 min',\n   sections:[\n    {key:'Om ja',items:['Avtal för fortsatt samarbete signeras','Definiera nästa modul eller utökning']},\n    {key:'Om nej',items:['Dokumentera anledningen i Pipeline-tracken','Ny period eller avslutar vi?']},\n  ]},\n];\nconst openMap={};\nfunction buildSteps(){\n  const w=document.getElementById('steps-wrap');\n  STEPS.forEach((s,i)=\u003e{\n    if(i\u003e0){const c=document.createElement('div');c.className='conn';c.style.cssText='background:'+s.color+';opacity:.4';w.appendChild(c);}\n    const card=document.createElement('div');card.className='card';\n    const sh=s.sections.map(sec=\u003e{\n      if(sec.agenda) return '\u003cdiv class=\"sec-key\"\u003e'+sec.key+'\u003c/div\u003e\u003cdiv class=\"agenda-box\"\u003e\u003cdiv class=\"agenda-title\"\u003e10 punkter\u003c/div\u003e'+sec.agenda.map((a,i)=\u003e'\u003cdiv class=\"agenda-item\"\u003e\u003cspan class=\"ag-num\"\u003e'+(i+1)+'.\u003c/span\u003e'+a+'\u003c/div\u003e').join('')+'\u003c/div\u003e';\n      return '\u003cdiv class=\"sec-key\"\u003e'+sec.key+'\u003c/div\u003e\u003cul class=\"sec-list\"\u003e'+sec.items.map(it=\u003e'\u003cli class=\"sec-item\"\u003e\u003cspan class=\"sec-arr\" style=\"color:'+s.color+'\"\u003e›\u003c/span\u003e'+it+'\u003c/li\u003e').join('')+'\u003c/ul\u003e';\n    }).join('');\n    card.innerHTML='\u003cbutton class=\"card-head\" onclick=\"toggleStep('+s.id+')\"\u003e\u003cdiv class=\"snum\" style=\"background:'+s.color+'\"\u003e'+s.id+'\u003c/div\u003e\u003cdiv class=\"slabel\"\u003e\u003cdiv class=\"stitle\"\u003e'+s.title+'\u003c/div\u003e\u003cdiv class=\"ssub\"\u003e'+s.sub+'\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"sdur\" style=\"background:'+s.bg+';color:'+s.color+';border:1px solid '+s.color+'66\"\u003e'+s.dur+'\u003c/div\u003e\u003cspan class=\"sarr\" id=\"arr-'+s.id+'\" style=\"transform:rotate(-90deg)\"\u003e›\u003c/span\u003e\u003c/button\u003e\u003cdiv class=\"sbody\" id=\"body-'+s.id+'\"\u003e\u003cdiv class=\"sborder\"\u003e'+sh+'\u003c/div\u003e\u003c/div\u003e';\n    w.appendChild(card);openMap[s.id]=false;\n  });\n}\nfunction toggleStep(id){openMap[id]=!openMap[id];document.getElementById('body-'+id).classList.toggle('open',openMap[id]);document.getElementById('arr-'+id).style.transform=openMap[id]?'rotate(90deg)':'rotate(-90deg)';}\n\nconst STAGES=[\n  {label:'Identifierade leads',color:'#4BBFB5',key:'s0'},\n  {label:'Bokat möte',color:'#4BBFB5',key:'s1'},\n  {label:'Församtal',color:'#3AA8A0',key:'s2'},\n  {label:'Genomgång',color:'#5B85F0',key:'s3'},\n  {label:'Kundplan',color:'#8C6FE8',key:'s4'},\n  {label:'Testperiod',color:'#D97706',key:'s5'},\n  {label:'Beslut JA ✓',color:'#22A63A',key:'s6',yes:true},\n  {label:'Beslut NEJ ✕',color:'#E24B4A',key:'s7',no:true},\n];\nconst vals={s0:100,s1:40,s2:30,s3:20,s4:14,s5:10,s6:7,s7:3};\nlet nejRows=[];\nfunction buildFunnel(){\n  const tb=document.getElementById('funnel-body');tb.innerHTML='';\n  STAGES.forEach((st,i)=\u003e{\n    const tr=document.createElement('tr');if(st.no)tr.className='nej-row';\n    tr.innerHTML='\u003ctd\u003e\u003cspan class=\"stage-dot\" style=\"background:'+st.color+'\"\u003e\u003c/span\u003e'+st.label+'\u003c/td\u003e\u003ctd\u003e\u003cinput class=\"inp-n'+(st.no?' red':'')+'\" type=\"number\" min=\"0\" value=\"'+vals[st.key]+'\" id=\"inp-'+st.key+'\" oninput=\"onInp(\\''+st.key+'\\',this.value)\"\u003e\u003c/td\u003e\u003ctd id=\"cvr-'+st.key+'\"\u003e\u003c/td\u003e\u003ctd id=\"bar-'+st.key+'\"\u003e\u003c/td\u003e';\n    tb.appendChild(tr);\n  });updateFunnel();\n}\nfunction onInp(k,v){vals[k]=Math.max(0,parseInt(v)||0);updateFunnel();}\nfunction updateFunnel(){\n  STAGES.forEach((st,i)=\u003e{\n    const cur=vals[st.key],prev=st.no?vals['s5']:i\u003e0?vals[STAGES[i-1].key]:null;\n    let cvr=null;if(prev!=null\u0026\u0026prev\u003e0)cvr=Math.round(cur/prev*100);\n    const cEl=document.getElementById('cvr-'+st.key),bEl=document.getElementById('bar-'+st.key);\n    if(i===0){cEl.innerHTML='\u003cspan class=\"cvr na\"\u003e—\u003c/span\u003e';bEl.innerHTML='';return;}\n    const cls=cvr==null?'na':cvr\u003e=50?'good':cvr\u003e=25?'mid':'low';\n    cEl.innerHTML='\u003cspan class=\"cvr '+cls+'\"\u003e'+(cvr!=null?cvr+'%':'—')+'\u003c/span\u003e';\n    const pct=cvr!=null?Math.min(100,cvr):0;\n    const bc=st.no?'#E24B4A':cvr\u003e=50?'#1D9E75':cvr\u003e=25?'#D97706':'#E24B4A';\n    bEl.innerHTML='\u003cdiv class=\"bar-wrap\"\u003e\u003cdiv class=\"bar-fill\" style=\"width:'+pct+'%;background:'+bc+'\"\u003e\u003c/div\u003e\u003c/div\u003e';\n  });updateKPIs();\n}\nfunction updateKPIs(){\n  const tot=vals.s0||1,won=vals.s6||0,lost=vals.s7||0,test=vals.s5||0;\n  const wr=Math.round(won/tot*100),nr=Math.round(lost/tot*100),cr=test\u003e0?Math.round(won/test*100):0;\n  document.getElementById('chip-wr').textContent=wr+'%';\n  document.getElementById('chip-nej').textContent=nr+'%';\n  document.getElementById('kpi-grid').innerHTML='\u003cdiv class=\"kpi-card hl\"\u003e\u003cdiv class=\"kpi-label\"\u003eWin rate\u003c/div\u003e\u003cdiv class=\"kpi-val\"\u003e'+wr+'%\u003c/div\u003e\u003cdiv class=\"kpi-sub\"\u003eLeads → Avtal\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi-card hl-red\"\u003e\u003cdiv class=\"kpi-label\"\u003eNej-rate\u003c/div\u003e\u003cdiv class=\"kpi-val\"\u003e'+nr+'%\u003c/div\u003e\u003cdiv class=\"kpi-sub\"\u003eLeads → Nej\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi-card\"\u003e\u003cdiv class=\"kpi-label\"\u003eClose rate\u003c/div\u003e\u003cdiv class=\"kpi-val\"\u003e'+cr+'%\u003c/div\u003e\u003cdiv class=\"kpi-sub\"\u003eTest → Avtal\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi-card\"\u003e\u003cdiv class=\"kpi-label\"\u003eLeads\u003c/div\u003e\u003cdiv class=\"kpi-val\"\u003e'+tot+'\u003c/div\u003e\u003cdiv class=\"kpi-sub\"\u003eIdentifierade\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi-card\"\u003e\u003cdiv class=\"kpi-label\"\u003eVunna\u003c/div\u003e\u003cdiv class=\"kpi-val\" style=\"color:#1D9E75\"\u003e'+won+'\u003c/div\u003e\u003cdiv class=\"kpi-sub\"\u003eSignerade\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"kpi-card\"\u003e\u003cdiv class=\"kpi-label\"\u003eFörlorade\u003c/div\u003e\u003cdiv class=\"kpi-val\" style=\"color:#E24B4A\"\u003e'+lost+'\u003c/div\u003e\u003cdiv class=\"kpi-sub\"\u003eTackade nej\u003c/div\u003e\u003c/div\u003e';\n}\nfunction renderNej(){\n  const tb=document.getElementById('nej-body');tb.innerHTML='';\n  nejRows.forEach((r,i)=\u003e{\n    const tr=document.createElement('tr');\n    tr.innerHTML='\u003ctd class=\"nej-num\"\u003e'+(i+1)+'\u003c/td\u003e\u003ctd\u003e\u003cinput class=\"nej-inp\" type=\"text\" placeholder=\"Bolag…\" value=\"'+r.bolag+'\" oninput=\"nejRows['+i+'].bolag=this.value\"\u003e\u003c/td\u003e\u003ctd\u003e\u003cinput class=\"nej-inp\" type=\"text\" placeholder=\"Anledning…\" value=\"'+r.anledning+'\" oninput=\"nejRows['+i+'].anledning=this.value\"\u003e\u003c/td\u003e\u003ctd style=\"text-align:center;padding:4px\"\u003e\u003cbutton class=\"del-btn\" onclick=\"delNej('+i+')\"\u003e✕\u003c/button\u003e\u003c/td\u003e';\n    tb.appendChild(tr);\n  });\n}\nfunction addNej(){nejRows.push({bolag:'',anledning:''});renderNej();}\nfunction delNej(i){nejRows.splice(i,1);renderNej();}\n\nfunction buildGantt(){\n  const W=9,rows=[\n    {label:'Prospektering'
